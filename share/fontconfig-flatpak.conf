<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font configuration for Flatpak sandboxes, installed by `just flatpak-fonts`
  as ~/.config/fontconfig/flatpak.conf and handed to every app through the
  FONTCONFIG_FILE override. It is the runtime's own configuration plus two
  fixes for an ostree host.

  1. The host font tree under its own cache key. Flatpak mounts the host's
     /usr/share/fonts at /run/host/fonts and tells fontconfig to treat it as
     /usr/share/fonts, so that the host's caches can be reused. The runtime
     ships a prebuilt cache for its *own* /usr/share/fonts under that same
     unsalted key, and on an ostree host both directories carry mtime 0, so
     fontconfig accepts the runtime's cache for the host tree and never looks
     at the host fonts at all. Seen with the freedesktop 26.08 runtime
     (fontconfig 2.18.3) on Fedora 44 (fontconfig 2.17.0): the host's cache
     files are the older cache-9 format, nothing else competes, and the
     runtime's stale entry wins. The salt gives the host tree a key of its
     own; fontconfig scans it once (under half a second) and caches the
     result in the app's own cache directory.

  2. Japanese glyph forms for CJK ideographs. The runtime's generic-family
     lists name only the Korean Noto CJK faces, so a Han character with no
     language tag (most text in a browser) falls to the KR face and its
     Korean-style glyphs. Fedora's own configuration prefers the JP faces;
     these rules do the same inside the sandbox, inserted just ahead of the
     KR entry so Latin text keeps the runtime's defaults.
-->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>

  <dir salt="topaz-host">/run/host/fonts</dir>

  <match target="pattern">
    <test name="family" compare="contains"><string>Noto Sans CJK KR</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Noto Serif CJK KR</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Noto Sans Mono CJK KR</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
</fontconfig>
